name: Build FFTW 2.1.5 on Apple Silicon

on:
  push:
    branches: [main, master, setup-ci]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & test (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 / macos-15 are Apple Silicon (M-series) runners.
        os: [macos-14, macos-15]
        variant: [double, single]

    steps:
      - uses: actions/checkout@v4

      - name: Check host architecture
        run: |
          uname -a
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          test "$(uname -m)" = "arm64"

      - name: Install autotools
        run: brew install autoconf automake libtool

      - name: Build via build.sh
        run: ./build.sh --${{ matrix.variant }}

      - name: Upload compiled library (install tree)
        uses: actions/upload-artifact@v4
        with:
          name: fftw-2.1.5-${{ matrix.os }}-${{ matrix.variant }}
          path: dist/install-${{ matrix.variant }}/
          if-no-files-found: error

      # The patched source tarball is identical across matrix cells —
      # only upload it once to avoid name collisions.
      - name: Upload patched source tarball
        if: matrix.os == 'macos-15' && matrix.variant == 'double'
        uses: actions/upload-artifact@v4
        with:
          name: fftw-2.1.5-patched-src
          path: dist/fftw-2.1.5-patched.tar.gz
          if-no-files-found: error
